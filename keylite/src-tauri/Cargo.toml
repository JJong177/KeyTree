[package]
name = "keytree"
version = "0.1.0"
description = "KeyTree - lightweight KDBX password manager (Windows-first)"
edition = "2021"

[lib]
name = "keytree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# 文件 watcher（网盘同步：外部修改自动重载/合并）；debouncer 0.7 配 notify 8
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
enigo = "0.6.1"
# Windows Hello（UserConsentVerifier，WinRT）
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_System_WinRT"] }
# DPAPI / 锁屏通知 / 电源事件 / 防截屏 / 消息窗口
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
